<svg width="760" height="260" viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&amp;family=Inter:wght@400;600;700&amp;display=swap');

      .node-box { fill: #0F172A; stroke-width: 1.5; rx: 8; }
      .lbl-title { font-family: 'Fira Code', monospace; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .lbl-sub { font-family: 'Inter', sans-serif; font-size: 11px; fill: #94A3B8; text-anchor: middle; }

      .flow-path { fill: none; stroke-width: 1.5; stroke-dasharray: 6 6; animation: dashPath 5s infinite linear; }
      @keyframes dashPath { to { stroke-dashoffset: -24; } }
    </style>
  </defs>

  <rect width="760" height="260" fill="#030712" rx="10" stroke="#1E293B" stroke-width="1.5" />

  <text x="380" y="28" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle">
    PIPELINE // HYBRID RETRIEVAL (DENSE VECTORS + LEXICAL + RE-RANKING)
  </text>

  <!-- Node 1: Docs / Data (x=30, y=90) -->
  <rect x="30" y="85" width="110" height="70" class="node-box" stroke="#38BDF8" />
  <text x="85" y="115" class="lbl-title" fill="#38BDF8">DATA SOURCE</text>
  <text x="85" y="132" class="lbl-sub">PDF / Web / Logs</text>

  <path d="M 140 120 L 180 120" class="flow-path" stroke="#38BDF8" />

  <!-- Node 2: Chunking & Embeddings (x=180, y=85) -->
  <rect x="180" y="85" width="130" height="70" class="node-box" stroke="#A855F7" />
  <text x="245" y="115" class="lbl-title" fill="#A855F7">EMBEDDINGS</text>
  <text x="245" y="132" class="lbl-sub">bge-large-en / SVD</text>

  <!-- Parallel paths to Dense Vector DB and BM25 Lexical -->
  <path d="M 310 105 L 360 80" class="flow-path" stroke="#00F0FF" />
  <path d="M 310 135 L 360 160" class="flow-path" stroke="#F59E0B" />

  <!-- Node 3A: Vector Search (Dense) -->
  <rect x="360" y="55" width="130" height="50" class="node-box" stroke="#00F0FF" />
  <text x="425" y="78" class="lbl-title" fill="#00F0FF">pgvector / FAISS</text>
  <text x="425" y="93" class="lbl-sub">Dense Similarity</text>

  <!-- Node 3B: Lexical Search (Sparse) -->
  <rect x="360" y="135" width="130" height="50" class="node-box" stroke="#F59E0B" />
  <text x="425" y="158" class="lbl-title" fill="#F59E0B">BM25 / TF-IDF</text>
  <text x="425" y="173" class="lbl-sub">Lexical Match</text>

  <!-- Paths to Cross-Encoder Re-ranker -->
  <path d="M 490 80 L 530 105" class="flow-path" stroke="#00F0FF" />
  <path d="M 490 160 L 530 135" class="flow-path" stroke="#F59E0B" />

  <!-- Node 4: Cross-Encoder Re-Ranker -->
  <rect x="530" y="90" width="100" height="60" class="node-box" stroke="#F43F5E" />
  <text x="580" y="117" class="lbl-title" fill="#F43F5E">RE-RANKER</text>
  <text x="580" y="133" class="lbl-sub">Cross-Encoder</text>

  <path d="M 630 120 L 660 120" class="flow-path" stroke="#F43F5E" />

  <!-- Node 5: Citation Synthesis -->
  <rect x="660" y="85" width="80" height="70" class="node-box" stroke="#10B981" />
  <text x="700" y="115" class="lbl-title" fill="#10B981">LLM / QA</text>
  <text x="700" y="132" class="lbl-sub">With Citations</text>
</svg>
