<svg width="860" height="340" viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap');

      .term-bg { fill: #0B0F19; stroke: #1E293B; stroke-width: 1.5; rx: 10; }
      .term-header { fill: #030712; rx: 10 10 0 0; }
      .term-title { font-family: 'Fira Code', monospace; font-size: 13px; fill: #64748B; font-weight: 600; text-anchor: middle; }
      
      .code-line { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 500; }
      .c-prompt { fill: #10B981; font-weight: 700; }
      .c-user { fill: #38BDF8; font-weight: 700; }
      .c-cmd { fill: #F1F5F9; }
      .c-comment { fill: #64748B; font-style: italic; }
      .c-key { fill: #A855F7; }
      .c-val { fill: #F59E0B; }
      .c-success { fill: #10B981; }
      .c-cyan { fill: #00F0FF; }

      .cursor {
        fill: #00F0FF;
        animation: blinkCursor 1s infinite;
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="860" height="340" class="term-bg" />
  
  <!-- Window Header Bar -->
  <path d="M 0 10 Q 0 0 10 0 L 850 0 Q 860 0 860 10 L 860 38 L 0 38 Z" fill="#030712" />
  <line x1="0" y1="38" x2="860" y2="38" stroke="#1E293B" stroke-width="1.5" />

  <!-- macOS Window Control Buttons -->
  <circle cx="20" cy="19" r="6" fill="#EF4444" />
  <circle cx="40" cy="19" r="6" fill="#F59E0B" />
  <circle cx="60" cy="19" r="6" fill="#10B981" />

  <!-- Terminal Title -->
  <text x="430" y="24" class="term-title">shannu018@antigravity-core: ~ (zsh)</text>

  <!-- Terminal Content Lines -->
  <g transform="translate(24, 70)">
    <!-- Line 1: Command Exec -->
    <text x="0" y="0" class="code-line">
      <tspan class="c-prompt">➜ </tspan>
      <tspan class="c-user">shannu018 </tspan>
      <tspan class="c-cmd">antigravity init --profile --verbose</tspan>
    </text>

    <!-- Line 2: Kernel boot -->
    <text x="0" y="26" class="code-line">
      <tspan class="c-comment">[SYS_LOG 09:45:19] Initializing Shannu018 Neural Kernel v4.2.0...</tspan>
    </text>

    <!-- Line 3: Vector Status -->
    <text x="0" y="52" class="code-line">
      <tspan class="c-success">✔ </tspan>
      <tspan class="c-key">VECTOR_DB</tspan>: pgvector + Qdrant [Hybrid Indexing Active]
    </text>

    <!-- Line 4: Agent Swarm -->
    <text x="0" y="78" class="code-line">
      <tspan class="c-success">✔ </tspan>
      <tspan class="c-key">AGENT_SWARM</tspan>: ReAct Multi-Agent Bus [Supervisor + 4 Workers]
    </text>

    <!-- Line 5: System Stack -->
    <text x="0" y="104" class="code-line">
      <tspan class="c-success">✔ </tspan>
      <tspan class="c-key">CORE_STACK</tspan>: Python, TypeScript, Next.js, FastAPI, Docker, PyTorch
    </text>

    <!-- Line 6: Focus Vectors -->
    <text x="0" y="130" class="code-line">
      <tspan class="c-success">✔ </tspan>
      <tspan class="c-key">CURRENT_VECTOR</tspan>: <tspan class="c-val">"Building self-correcting RAG memory &amp; low-latency agents"</tspan>
    </text>

    <!-- Divider Line -->
    <line x1="0" y1="150" x2="812" y2="150" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Line 7: Next Prompt -->
    <text x="0" y="180" class="code-line">
      <tspan class="c-prompt">➜ </tspan>
      <tspan class="c-user">shannu018 </tspan>
      <tspan class="c-cmd">agent_swarm --status --deploy-mode=prod</tspan>
    </text>

    <!-- Line 8: Status message -->
    <text x="0" y="206" class="code-line">
      <tspan class="c-cyan">⚡ AGENT SWARM RUNNING: 0 errors, 100% test coverage, ready for scale.</tspan>
    </text>

    <!-- Line 9: Cursor -->
    <text x="0" y="234" class="code-line">
      <tspan class="c-prompt">➜ </tspan>
      <tspan class="c-user">shannu018 </tspan>
      <rect x="110" y="221" width="9" height="16" class="cursor" />
    </text>
  </g>
</svg>
